apiVersion: v1
kind: ConfigMap
metadata:
  name: restapi-config
  namespace: student-api

data:
  DATABASE_URL: "postgresql://postgres:password@postgresdb-service:5432/students"
  PORT: "5000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restapi-deployment
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: restapi

  template:
    metadata:
      labels:
        app: restapi

    spec:
    
      containers:
      - name: restapi

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        ports:
        - containerPort: 5000

        envFrom:
        - configMapRef:
            name: restapi-config

        - configMapRef:
            name: postgresdb-config

        - secretRef:
            name: db-secret
