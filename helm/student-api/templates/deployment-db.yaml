apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresdb-config
  namespace: student-api

data:
  POSTGRES_DB: students
  POSTGRES_USER: postgres

---

apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: student-api
type: OpaqueOpaque
data:
  POSTGRES_PASSWORD: cGFzc3dvcmQ=

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: student-api
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /home/vicky/postgres-data

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: student-api

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresdb-deployment
  namespace: {{ .Values.namespace }}

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgresdb

  template:
    metadata:
      labels:
        app: postgresdb

    spec:
      nodeSelector:
        type: database

      containers:
      - name: postgresdb
        image: {{ .Values.postgres.image }}

        ports:
        - containerPort: 5432

        envFrom:
        - configMapRef:
            name: postgresdb-config

        - secretRef:
            name: db-secret

        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-storage

      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc